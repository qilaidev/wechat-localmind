name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.12"
            install-deps: false
          - os: ubuntu-latest
            python-version: "3.11"
            install-deps: true
          - os: ubuntu-latest
            python-version: "3.12"
            install-deps: true
          - os: windows-latest
            python-version: "3.12"
            install-deps: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install non-macOS crypto & zstd backends
        if: matrix.install-deps
        run: python -m pip install cryptography zstandard

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Smoke-check CLI wrappers
        run: |
          python bin/wechat-localmind --help
          python skills/wechat-localmind/scripts/wechat-localmind --help
