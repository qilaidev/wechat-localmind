[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-localmind"
version = "2.0.0"
description = "Zero-dependency macOS & Windows WeChat 3.x/4.x (WCDB) full-account local read-only chat extractor, cleaner, CLI & MCP Server for AI Agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "qilaidev" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "wechat",
    "wcdb",
    "mcp-server",
    "ai-agent",
    "cli",
    "sqlcipher",
    "zstd",
    "fts5",
    "macos",
    "windows",
    "local-first",
    "read-only",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/qilaidev/wechat-localmind"
Repository = "https://github.com/qilaidev/wechat-localmind"
Issues = "https://github.com/qilaidev/wechat-localmind/issues"
Documentation = "https://github.com/qilaidev/wechat-localmind#readme"

[project.scripts]
wechat-localmind = "wx_localmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
